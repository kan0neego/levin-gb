name: Build and Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PNPM setup
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22

      - run: pnpm install

      - name: Production build
        run: pnpm build:blocks

      - name: Deploy to PROD via SSH (SCP)
        id: ssh-deploy
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_NAME }}
          key: ${{ secrets.RSA_KEY }}
          source: dist/blocks/*
          target: /var/www/vhosts/u0139435.plsk.regruhosting.ru/httpdocs/doctorlevin.ru/wp-content/themes/sd-03-2_new/blocks
          strip_components: 2
          rm: false

      - name: Deploy to PROD via FTP (fallback)
        id: ftp-deploy
        if: steps.ssh-deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/blocks/
          server-dir: httpdocs/doctorlevin.ru/wp-content/themes/sd-03-2_new/blocks/

      - name: Remove obsolete tab blocks
        if: steps.ssh-deploy.outcome == 'success' || steps.ftp-deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_NAME }}
          key: ${{ secrets.RSA_KEY }}
          script: |
            set -e
            ROOT=/var/www/vhosts/u0139435.plsk.regruhosting.ru/httpdocs/doctorlevin.ru/wp-content/themes/sd-03-2_new/blocks
            rm -rf "$ROOT/tab" "$ROOT/tabs-new"
            test ! -e "$ROOT/tab"
            test ! -e "$ROOT/tabs-new"
            test -f "$ROOT/tabs/block.json"
            test -f "$ROOT/tabs/tab/block.json"
            grep '"name"' "$ROOT/tabs/block.json" "$ROOT/tabs/tab/block.json"
            echo "obsolete directories removed"
